services:

  user-db:
    image: mysql:8.0.39
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: user
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - userdb_data:/var/lib/mysql
    networks:
      - microservices-net
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.50"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  product-db:
    image: mysql:8.0.39
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: product
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - productdb_data:/var/lib/mysql
    networks:
      - microservices-net
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.50"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  order-db:
    image: mysql:8.0.39
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: order
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - orderdb_data:/var/lib/mysql
    networks:
      - microservices-net
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.50"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  user-service:
    image: ${DOCKER_USER}/user-service:${IMAGE_TAG:-latest}
    environment:
      CONFIGURATION_SETUP: config.ProductionConfig
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@user-db:3306/user
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      user-db:
        condition: service_healthy
    networks:
      - microservices-net
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.50"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  product-service:
    image: ${DOCKER_USER}/product-service:${IMAGE_TAG:-latest}
    environment:
      CONFIGURATION_SETUP: config.ProductionConfig
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@product-db:3306/product
    depends_on:
      product-db:
        condition: service_healthy
    networks:
      - microservices-net
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.50"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  order-service:
    image: ${DOCKER_USER}/order-service:${IMAGE_TAG:-latest}
    environment:
      CONFIGURATION_SETUP: config.ProductionConfig
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@order-db:3306/order
    depends_on:
      order-db:
        condition: service_healthy
    networks:
      - microservices-net
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.50"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5003/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


  nginx:
    image: nginx:1.27.3-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    networks:
      - microservices-net
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.25"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- http://localhost/ >/dev/null 2>&1 || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 3


volumes:
  userdb_data:
  productdb_data:
  orderdb_data:


networks:
  microservices-net:
    driver: bridge