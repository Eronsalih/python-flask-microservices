server {
    listen 80;
    server_name _;

    location = / {
        default_type text/plain;
        return 200 "Variant B microservices stack is running\n";
    }

    location = /health/user {
        proxy_pass http://user-service:5001/health;
    }

    location = /health/product {
        proxy_pass http://product-service:5002/health;
    }

    location = /health/order {
        proxy_pass http://order-service:5003/health;
    }

    location /user/ {
        proxy_pass http://user-service:5001/;
    }

    location /product/ {
        proxy_pass http://product-service:5002/;
    }

    location /order/ {
        proxy_pass http://order-service:5003/;
    }
}